[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podautopsy"
version = "1.0.0"
description = "Automated Kubernetes incident post-mortem generator"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "kubernetes>=29.0",
  "rich>=13.0",
  "boto3>=1.34",
  "jinja2>=3.1",
  "python-dateutil>=2.8",
  "pydantic>=2.0",
  "anthropic>=0.25",
]

[project.scripts]
podautopsy = "podautopsy.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-mock>=3.12",
  "black>=24.0",
  "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
